name: Update Projections

# Saves Sleeper's weekly fantasy projections (current week through week 18) to
# data/projections/{season}/week{NN}.json, so the app shows projected points for upcoming
# weeks without calling Sleeper. Projections move during the week (injuries, depth charts),
# so this runs every 4 hours.

concurrency:
  group: projections
  cancel-in-progress: true

on:
  workflow_dispatch:

  schedule:
    - cron: '50 */4 * * *'

jobs:
  update-projections:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Install required R packages
        run: |
          Rscript -e "options(repos='https://cloud.r-project.org'); install.packages(c('httr', 'jsonlite'))"

      - name: Test projection helpers
        run: Rscript scripts/tests/test_projection_helpers.R

      - name: Update projections
        run: Rscript scripts/update_projections.R

      - name: Commit updated projections
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "github-actions"
          git add data/projections
          git commit -m "Update projections" || echo "No changes"
          git pull --rebase origin main
          git push
