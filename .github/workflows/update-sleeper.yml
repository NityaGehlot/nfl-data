name: Update Sleeper Data

concurrency:
  group: sleeper-data
  cancel-in-progress: true

on:
  workflow_dispatch:

  schedule:
    # Every day at 01:00 UTC
    - cron: '0 1 * * *'

jobs:
  update-sleeper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install required R packages
        run: |
          Rscript -e "options(repos='https://cloud.r-project.org'); install.packages(c(
            'httr',
            'jsonlite'
          ))"

      - name: Update Sleeper player data
        run: |
          Rscript scripts/update_players.R

      - name: Commit updated Sleeper files
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "github-actions"

          git add \
            data/sleeperAPI/sleeper_players.json \
            data/sleeperAPI/trending_adds.json \
            data/sleeperAPI/trending_drops.json

          git commit -m "Update Sleeper player database" || echo "No changes"

          git pull --rebase origin main

          git push
