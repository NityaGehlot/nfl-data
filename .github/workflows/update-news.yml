name: Update NFL News

# Prevent overlapping runs
concurrency:
  group: nfl-news
  # Queue a new run instead of killing one that's still writing files
  cancel-in-progress: false

on:
  workflow_dispatch:

  schedule:
    # Every 2 hours at :15 (a full run takes ~30 minutes). Off-the-hour times get
    # delayed less by GitHub than schedules at minute 0.
    - cron: '15 */2 * * *'

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install required R packages
        run: |
          Rscript -e "options(repos='https://cloud.r-project.org'); install.packages(c(
            'httr',
            'jsonlite',
            'dplyr',
            'stringr',
            'lubridate',
            'xml2',
            'stringdist'
          ))"

      - name: Test news helpers
        run: |
          Rscript scripts/tests/test_news_helpers.R
          Rscript scripts/tests/test_espn_news.R

      - name: Generate NFL news
        run: |
          Rscript scripts/generate_nfl_news.R

      - name: Commit updated news
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "github-actions"

          git add data/news/*.json

          git commit -m "Update NFL news" || echo "No changes"

          git pull --rebase origin main

          git push
