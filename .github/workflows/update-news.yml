name: Update NFL News

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e "options(repos='https://cloud.r-project.org'); install.packages(c(
            'httr',
            'jsonlite',
            'dplyr',
            'stringr',
            'lubridate',
            'xml2',
            'nflreadr'
          ))"

      - name: Run news generator
        run: |
          Rscript scripts/generate_nfl_news.R

      - name: Commit updated news
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "github-actions"
          git add data/nfl_news.json
          git commit -m "Update NFL news" || echo "No changes"
          git push
