name: Backfill Injury History

# One-time (or occasional) fill of data/injuries/history/{season}/week{NN}.json with the NFL's
# official weekly injury report for every season from 2011 on. Run it from the Actions tab
# ("Run workflow"). Weeks already saved are left alone, so it's safe to run again.

concurrency:
  group: injuries
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      first_season:
        description: "First season to fill"
        default: "2011"
      last_season:
        description: "Last season to fill (blank = latest season in data/Stats)"
        default: ""

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install required R packages
        run: |
          Rscript -e "options(repos='https://cloud.r-project.org'); install.packages(c('httr', 'jsonlite', 'nflreadr'))"

      - name: Test injury helpers
        run: Rscript scripts/tests/test_injury_helpers.R

      - name: Backfill injury history
        run: Rscript scripts/backfill_injury_history.R "${{ github.event.inputs.first_season }}" ${{ github.event.inputs.last_season }}

      - name: Commit injury history
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "github-actions"
          git add data/injuries/history
          git commit -m "Backfill injury history" || echo "No changes"
          git pull --rebase origin main
          git push
