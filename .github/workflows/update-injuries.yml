name: Update Injuries

# Prevent overlapping runs
concurrency:
  group: injuries
  cancel-in-progress: true

on:
  workflow_dispatch:

  schedule:
    # Twice a day: mid-morning ET (overnight IR moves) and evening ET (after teams post
    # that day's practice report). Times are UTC.
    - cron: '0 14 * * *'
    - cron: '30 23 * * *'

jobs:
  update-injuries:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install required R packages
        run: |
          Rscript -e "options(repos='https://cloud.r-project.org'); install.packages(c('httr', 'jsonlite', 'nflreadr'))"

      - name: Test injury helpers
        run: Rscript scripts/tests/test_injury_helpers.R

      - name: Update injuries
        run: Rscript scripts/update_injuries.R

      - name: Commit updated injuries
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "github-actions"

          git add data/injuries

          git commit -m "Update injuries" || echo "No changes"

          git pull --rebase origin main

          git push
