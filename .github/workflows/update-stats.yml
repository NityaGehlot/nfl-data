name: Update NFL Weekly Stats
on:
  workflow_dispatch:
    inputs:
      enforce_offseason:
        description: 'Enforce offseason restrictions? (true = skip if offseason, false = always run)'
        required: false
        default: 'true'
  schedule:
    - cron: '0 6 * * TUE'   # Every Tuesday at 06:00 UTC
jobs:
  check-season:
    runs-on: ubuntu-latest
    outputs:
      in_season: ${{ steps.check.outputs.in_season }}
    steps:
      - name: Check if NFL season is active
        id: check
        run: |
          ENFORCE="${{ github.event.inputs.enforce_offseason }}"

          if [ "$ENFORCE" = "false" ]; then
            echo "Offseason restrictions disabled — forcing run."
            echo "in_season=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          MONTH=$(date +%-m)
          if [ "$MONTH" -ge 9 ] || [ "$MONTH" -le 2 ]; then
            echo "in_season=true" >> $GITHUB_OUTPUT
          else
            echo "in_season=false" >> $GITHUB_OUTPUT
            echo "Skipping: offseason (month $MONTH). Set enforce_offseason=false to override."
          fi

  update:
    runs-on: ubuntu-latest
    needs: check-season
    if: needs.check-season.outputs.in_season == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clear existing JSON files (force regenerate)
        if: github.event.inputs.enforce_offseason == 'false'
        run: |
          rm -rf data/Stats/
          echo "Cleared existing stats files — full regeneration will run."

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
      - name: Install R dependencies (including nflreadr)
        run: |
          Rscript -e "options(repos='https://cloud.r-project.org'); install.packages(c('dplyr','jsonlite','readr','lubridate','data.table'))"
          Rscript -e "install.packages('nflreadr', repos='https://cloud.r-project.org')"
          Rscript -e "if (!require('nflreadr')) install.packages('nflreadr', repos=c('https://nflverse.r-universe.dev', 'https://cloud.r-project.org'))"
      - name: Run stats generator
        run: |
          Rscript scripts/generate_weekly_stats.R
      - name: Commit generated JSON (if changed)
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "github-actions"
          git add data/Stats/**/*.json
          git commit -m "Update player stats JSON" || echo "No changes to commit"
          git pull --rebase origin main
          git push
